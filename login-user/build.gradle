version (Boolean.valueOf(System.getProperty("snapshot")) ? "0.0.1-SNAPSHOT" : "2.0.1")
group 'com.guns21'
apply from: 'https://gitlab.ktjr.com/open-source/java-gradle/raw/2.x.x/spring-boot.gradle'
//apply from: 'https://raw.githubusercontent.com/21guns/java-gradle/2.x.x/spring-boot.gradle'
dependencies {
    api 'javax.servlet:javax.servlet-api'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'org.springframework.data:spring-data-redis'
    implementation 'org.springframework.security:spring-security-cas'
}
